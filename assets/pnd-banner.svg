<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">PND — Positive-and-Negative Decoding</title>
  <desc id="desc">Original, likelihood-amplified, and prior-isolated visual streams converge into grounded decoding.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B1A"/><stop offset="0.48" stop-color="#151044"/><stop offset="1" stop-color="#071C2D"/></linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70E1F5"/><stop offset="0.5" stop-color="#B57CFF"/><stop offset="1" stop-color="#FF6B9F"/></linearGradient>
    <linearGradient id="positive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F5A0"/><stop offset="1" stop-color="#00D9F5"/></linearGradient>
    <linearGradient id="negative" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FF8A4C"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#background)"/>
  <rect width="1400" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1130" cy="-40" r="250" fill="#7C4DFF" opacity="0.12"/><circle cx="1280" cy="330" r="220" fill="#00D9F5" opacity="0.08"/><circle cx="120" cy="360" r="180" fill="#FF4D8D" opacity="0.07"/>
  <g transform="translate(86 66)">
    <rect width="120" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/><text x="60" y="20" text-anchor="middle" fill="#D8D8F0" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CVPR 2026</text>
    <text x="0" y="105" fill="url(#titleGradient)" font-family="Inter,Segoe UI,sans-serif" font-size="100" font-weight="900" letter-spacing="4">PND</text>
    <text x="4" y="150" fill="#F7F3FF" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">When Positive Meets Negative</text>
    <text x="4" y="188" fill="#AAA8C7" font-family="Inter,Segoe UI,sans-serif" font-size="18">Bayesian belief adjustment for visually grounded generation</text>
  </g>
  <g transform="translate(760 64)" font-family="Inter,Segoe UI,sans-serif">
    <path d="M82 68C190 68 185 116 278 116" fill="none" stroke="#90A0C0" stroke-width="3" stroke-opacity="0.65"/><path d="M82 116C190 116 185 116 278 116" fill="none" stroke="url(#positive)" stroke-width="4" filter="url(#glow)"/><path d="M82 164C190 164 185 116 278 116" fill="none" stroke="url(#negative)" stroke-width="4" filter="url(#glow)"/>
    <g transform="translate(0 44)"><circle cx="40" cy="24" r="30" fill="#17223F" stroke="#8492B5" stroke-width="2"/><text x="40" y="29" text-anchor="middle" fill="#DCE4FF" font-size="12" font-weight="700">ORIG</text></g>
    <g transform="translate(0 92)"><circle cx="40" cy="24" r="30" fill="#0B2B31" stroke="url(#positive)" stroke-width="3" filter="url(#glow)"/><text x="40" y="29" text-anchor="middle" fill="#B9FFE9" font-size="12" font-weight="800">POS</text></g>
    <g transform="translate(0 140)"><circle cx="40" cy="24" r="30" fill="#351527" stroke="url(#negative)" stroke-width="3" filter="url(#glow)"/><text x="40" y="29" text-anchor="middle" fill="#FFD2E1" font-size="12" font-weight="800">NEG</text></g>
    <g transform="translate(278 74)"><rect width="188" height="84" rx="22" fill="#171533" stroke="#9E7CFF" stroke-width="2" filter="url(#glow)"/><text x="94" y="35" text-anchor="middle" fill="#F4EEFF" font-size="16" font-weight="800">PND DECODER</text><text x="94" y="59" text-anchor="middle" fill="#ACA2D1" font-size="12">contrast · suppress · ground</text></g>
    <path d="M466 116H528" stroke="#B57CFF" stroke-width="4" filter="url(#glow)"/><path d="M520 108L532 116 520 124" fill="none" stroke="#B57CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="568" cy="116" r="37" fill="#102A34" stroke="#70E1F5" stroke-width="3" filter="url(#glow)"/><path d="M551 116l11 11 23-25" fill="none" stroke="#70E1F5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="568" y="174" text-anchor="middle" fill="#C9ECF3" font-size="13" font-weight="700">GROUNDED</text>
  </g>
  <rect x="1" y="1" width="1398" height="358" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
